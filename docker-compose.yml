# Local infrastructure for the Dual-Engine Personalized Learning Framework.
# Single-machine deployment (NFR-REL-005): `docker compose up -d` then `npm run bootstrap`.

services:
  postgres:
    # pgvector/pgvector ships the `vector` extension prebuilt against PG17.
    image: pgvector/pgvector:pg17
    container_name: dual-engine-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dualengine}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dualengine}
      POSTGRES_DB: ${POSTGRES_DB:-dualengine}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Runs once on an empty data directory; enables vector, pg_trgm, pgcrypto.
      - ./infra/postgres-init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dualengine} -d ${POSTGRES_DB:-dualengine}"]
      interval: 5s
      timeout: 5s
      retries: 20

  neo4j:
    image: neo4j:5-community
    container_name: dual-engine-neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-dualengine}
      NEO4J_server_memory_heap_max__size: 1G
      NEO4J_dbms_security_procedures_unrestricted: apoc.*
    ports:
      - "${NEO4J_HTTP_PORT:-7474}:7474" # Neo4j Browser — FR-INT-033 visual inspection
      - "${NEO4J_BOLT_PORT:-7687}:7687"
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: dual-engine-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  postgres-data:
  neo4j-data:
  neo4j-logs:
  redis-data:
